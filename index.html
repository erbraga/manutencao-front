<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./static/styles.css">
    
    <title>Manutenção de veículos</title>
</head>
<body>
    <div class="container">
        <header class="sombra borda">
                <h1 class="cabecalho-titulo">
                    Manutenção de veículos
                </h1>
                <div class="cabecalho-form">
                    <form action="" method="post" class="form-veiculo">
                        <div class="form-veiculo-col1">
                            <label for="veiculo">Veículo:</label>
                            <div class="form-veiculo-inputs" >
                                <div id="veiculo-id" class="invisivel"></div>
                                <input type="text" id="veiculo" name ="veiculo" class="form-veiculo-inputs invisivel-desktop">
                                <select id="veiculos-selecionar" class="form-veiculo-inputs visivel-desktop">
                                    <option value="#">Selecione um veículo</option>
                                </select>

                            </div>
                        </div>
                        <div class="form-veiculo-botoes">
                            <button id="veiculo-btn-incluir" type="button" class = "cabecalho-btn i-incluir visivel-desktop">
                            </button>
                            <button id="veiculo-btn-editar" type="button" class = "cabecalho-btn i-editar visivel-desktop">
                            </button>
                            <button id="veiculo-btn-cancelar" type="button" class = "cabecalho-btn i-cancelar invisivel-desktop">
                            </button>
                            <button id="veiculo-btn-salvar" type="button" class = "cabecalho-btn i-salvar invisivel-desktop">
                            </button>
                            <button id="veiculo-btn-excluir" type="button" class = "cabecalho-btn i-deletar visivel-desktop">
                            </button>
                        </div>
                    </form>
                    <form action=""  class="form-info">
                        <div class="form-info-col">
                            <label for="data">data:</label>
                            <input type="date" id="data" name ="data">
                        </div>
                        <div class="form-info-col">
                            <label for="km">Quilometragem:</label>
                            <input type="number" name="km" id="km">
                        </div>
                    </form>
                </div>
        </header>

        <section id = "formulario" class="formulario sombra borda invisivel">
            <form  class="" action="">
                <div class="formulario-item">
                    <label for="item">Item:</label>
                    <input type="text" id="item">
                </div>
                <div class="formulario-campos">
                    <label for="especificacao-km">Km para troca</label>
                    <input type="number" name="especificacao-km" id="especificacao-km">
                </div>
                <div class="formulario-campos">
                    <label for="especificacao-prazo">Prazo para troca (em meses)</label>
                    <input type="number" name="especificacao-prazo" id="especificacao-prazo">
                </div>
                <div class="formulario-campos">
                    <label for="ultima-troca-km"> Km da última troca</label>
                    <input type="number" name="ultima-troca-km" id="ultima-troca-km">
                </div>
                <div class="formulario-campos">
                    <label for="ultima-troca-data">Data da última troca</label>
                    <input type="date" name="ultima-troca-data" id="ultima-troca-data">
                </div>
                <div class="formulario-campos">
                    <button class="btn" type="button" id="btnFormulario">
                        <img src="./static/icones/novo.svg" alt="Novo item">
                        Novo item</button>
                </div>
            </form>
        </section>
        <section class="corpo">
            <div class="sem-scroll sombra borda">
                <table>
                    <thead>
                        <tr>
                            <th rowspan="2" class="item">Item de manutenção</th>
                            <th colspan="2">Trocar a cada</th>
                            <th colspan="2">Última troca</th>
                            <th colspan="2">Próxima troca</th>
                            <th rowspan="2" class="acoes">ações</th>
                        </tr>
                        <tr>
                            <th class="especificacao-km"">km</th>
                            <th class="prazo">meses</th>
                            <th class="ultima-km">km</th>
                            <th class="ultima-data">data</th>
                            <th class="proxima-km">km</th>
                            <th class="proxima-data">data</th>
                        </tr>
                    </thead>
                </table>
            </div>
            <div class="scroll sombra borda">
                <table id="tabela" class="tabela">
                    <tbody>
                    </tbody>
                </table>
            </div>

            <div class="botao-flutuante" id="botao-flutuante">
                <button class="icone i-adicionar"></button>
            </div>

        </section>
    </div>

    <script src="./static/script.js"></script>
</body>
</html>
