<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./static/styles.css">
    
    <title>Manutenção de veículos</title>
</head>
<body>
    <div class="container">
        <header class="sombra borda">
                <h1 class="cabecalho-titulo">
                    Manutenção de veículos
                </h1>
                <div class="cabecalho-form">
                    <form action="" method="post" class="form-veiculo">
                        <label for="veiculo">Veículo:</label>
                        <input type="text" id="veiculo" name ="veiculo" value = "Fiat Pulse Audace 1.0 turbo AT - ano 2023">
                    </form>
                    <form action=""  class="form-info">
                        <div class="form-info-col">
                            <label for="data">data:</label>
                            <input type="date" id="data" name ="data" value="2025-12-12">
                        </div>
                        <div class="form-info-col">
                            <label for="km">Quilometragem:</label>
                            <input type="number" name="km" id="km" value="25468">
                        </div>
                    </form>
                </div>
        </header>

        <section class="formulario sombra borda">
            <form action="">
                <div class="formulario-item">
                    <label for="item">Item:</label>
                    <input type="text" id="item" value="Teste de peça para trocar logo, antes que estrague">
                </div>
                <div class="formulario-campos">
                    <label for="especificacao-km">Km para troca</label>
                    <input type="number" name="especificacao-km" id="especificacao-km" value="10000">
                </div>
                <div class="formulario-campos">
                    <label for="especificacao-prazo">Prazo para troca (em meses)</label>
                    <input type="number" name="especificacao-prazo" id="especificacao-prazo" value = "12">
                </div>
                <div class="formulario-campos">
                    <label for="ultima-troca-km"> Km da última troca</label>
                    <input type="number" name="ultima-troca-km" id="ultima-troca-km" value="8397">
                </div>
                <div class="formulario-campos">
                    <label for="ultima-troca-data">Data da última troca</label>
                    <input type="date" name="ultima-troca-data" id="ultima-troca-data" value="2021-11-12">
                </div>
                <div class="formulario-campos">
                    <button class="btn" type="button" id="btnFormulario" onclick="lerFormulario()">
                        <img src="./static/fonts/upgrade_48dp_26A269.svg" alt="Novo item">
                        Novo item</button>
                </div>
            </form>
        </section>
        <section class="corpo">
            <div class="sem-scroll sombra borda">
            <table>
                <thead>
                    <tr>
                        <th rowspan="2" class="item">Item de manutenção</th>
                        <th colspan="2">Trocar a cada</th>
                        <th colspan="2">Última troca</th>
                        <th colspan="2">Próxima troca</th>
                        <th rowspan="2" class="acoes">ações</th>
                    </tr>
                    <tr>
                        <th class="km">km</th>
                        <th class="prazo">meses</th>
                        <th class="km">km</th>
                        <th class="data">data</th>
                        <th class="km">km</th>
                        <th class="data">data</th>
                    </tr>
                </thead>
            </table>
            </div>
            <div class="scroll sombra borda">
                <table id="tabela">
                    <tbody>
                        <tr>
                            <td class="item">Óleo lubrificante</td>
                            <td class="km">9.999.999</td>
                            <td class="prazo">999</td>
                            <td class="km">9.999.999</td>
                            <td class="centro data">20/10/2024</td>
                            <td class="km">9.999.999</td>
                            <td class="centro data">20/10/2025</td>
                            <td class="acoes">
                                <button class = "icone i-atualizar"></button>
                                <button class = "icone i-deletar"></button>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class="card borda sombra">
                    <div class="card-titulo">
                        <span>Óleo lubrificante </span>
                        <div>
                            <button class = "icone i-atualizar"></button>
                            <button class = "icone i-deletar"></button>
                        </div>
                    </div>
                    <div class = "card-corpo">
                        <div class="card-col">
                            <div>Última troca:</div>
                            <div>9.999.999km - 20/10/2024</div>
                        </div>
                        <div class="card-col">
                            <div>Próxima troca:</div>
                            <div>9.999.999km - 20/10/2024</div>
                        </div>
                    </div>
                </div>

                </div>
            </div>

            <div class="botao-flutuante">
                <button class="icone i-adicionar"></button>
            </div>

        </section>
    </div>

    <script src="./static/script.js"></script>
</body>
</html>
